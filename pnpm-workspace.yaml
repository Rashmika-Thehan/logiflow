packages:
  - 'apps/*'
  - 'libs/*'
overrides:
  '@nestjs/common': '11.0.1'
  '@nestjs/core': '11.0.1'
  '@nestjs/platform-express': '11.0.1'
  '@nestjs/microservices': '11.0.1'
  'bullmq>ioredis': '^6.0.0'
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  unrs-resolver: true
  workerd: false
