apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logiflow-ingress
  namespace: logiflow
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # Equivalent to NGINX max body size (15MB)
    traefik.ingress.kubernetes.io/request-body-size: "15728640"
    # Traefik handles WebSockets automatically over HTTP/HTTPS, 
    # but you can add middleware or timeouts if needed
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000