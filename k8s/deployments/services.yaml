# ==============================================================================
# Microservices Deployments & Services
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Identity Service (Port 3001)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: logiflow
  labels:
    app: identity-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: rashmikathehan/identity-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: logiflow-config
            - secretRef:
                name: logiflow-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: logiflow
spec:
  selector:
    app: identity-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP

---
